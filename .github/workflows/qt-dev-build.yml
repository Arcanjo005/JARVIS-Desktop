name: JARVIS Qt Private Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - ui/qt-reference-rebuild
    paths:
      - ".github/qt-dev-request.json"

permissions:
  contents: write

concurrency:
  group: jarvis-qt-private-candidate
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DEV_VERSION: "1.3.12"
      DEV_BUILD_ID: "dev-${{ github.run_number }}"

    steps:
      - name: Checkout Qt rebuild
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies once
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r build/requirements-build.txt "PyYAML>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Activate integrated V4 UI in candidate workspace
        shell: pwsh
        run: |
          python -m py_compile gui_qt_integrated.py
          if ($LASTEXITCODE -ne 0) { throw "gui_qt_integrated.py syntax check failed" }

          $BuildScript = "build/build_qt_dev.ps1"
          $BuildSource = Get-Content -LiteralPath $BuildScript -Raw
          $BuildSource = $BuildSource.Replace("from gui_qt_dev import JarvisGUI", "from gui_qt_integrated import JarvisGUI")
          Set-Content -LiteralPath $BuildScript -Value $BuildSource -Encoding utf8
          if (-not ((Get-Content -LiteralPath $BuildScript -Raw).Contains("from gui_qt_integrated import JarvisGUI"))) {
            throw "Could not switch Qt Dev build to integrated V4 UI"
          }

          $SmokePath = "jarvis_qt_ui_smoke.py"
          $Smoke = Get-Content -LiteralPath $SmokePath -Raw
          $Smoke = $Smoke.Replace("from gui_qt_reference_v2 import JarvisGUI", "from gui_qt_integrated import JarvisGUI")
          $Smoke = $Smoke.Replace("window.sidebar.width() == 286", "window.sidebar.width() == 310")
          $Smoke = $Smoke.Replace("window.transcript_frame.height() <= 245", "window.transcript_frame.height() >= 250")
          Set-Content -LiteralPath $SmokePath -Value $Smoke -Encoding utf8

      - name: Fast integrated Qt smoke before packaging
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python jarvis_qt_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Integrated Qt smoke failed" }

      - name: Build integrated Qt Dev installer
        shell: pwsh
        run: |
          ./build/build_qt_dev.ps1 `
            -Version "$env:DEV_VERSION" `
            -BuildId "$env:DEV_BUILD_ID" `
            -Repository "${{ github.repository }}" `
            -RunNumber "${{ github.run_number }}"

      - name: Publish installer to private draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "qt-dev-private-$env:DEV_BUILD_ID"
          $title = "JARVIS Qt Private $env:DEV_BUILD_ID"
          $notes = @"
          Private Qt candidate for manual validation.

          Version: $env:DEV_VERSION
          Build: $env:DEV_BUILD_ID
          Commit: ${{ github.sha }}
          UI: integrated V4 candidate

          This release stays in DRAFT and is not published as prerelease/latest.
          The public Dev manifest is intentionally not changed.
          "@

          gh release create $tag `
            --repo $repo `
            --draft `
            --target "${{ github.sha }}" `
            --title $title `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Could not create private draft release" }

          gh release upload $tag `
            "release/JARVIS_Setup_$env:DEV_VERSION.exe" `
            "release/JARVIS_Setup_$env:DEV_VERSION.exe.sha256" `
            "release/dev-build.json" `
            --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "Could not upload private installer" }

          Write-Host "PRIVATE_DRAFT_TAG=$tag"
          Write-Host "DEV_BUILD_ID=$env:DEV_BUILD_ID"

      - name: Confirm private candidate identity
        shell: pwsh
        run: |
          $identity = Get-Content -LiteralPath "release/dev-build.json" -Raw | ConvertFrom-Json
          Write-Host "Version: $($identity.version)"
          Write-Host "Build: $($identity.build_id)"
          Write-Host "SHA256: $($identity.sha256)"
          Write-Host "Size: $($identity.size)"
          if ([string]$identity.build_id -ne $env:DEV_BUILD_ID) { throw "Build identity mismatch" }
