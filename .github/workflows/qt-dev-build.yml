name: JARVIS Qt Dev Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - ui/qt-reference-rebuild
    paths:
      - ".github/qt-dev-request.json"

permissions:
  contents: write

concurrency:
  group: jarvis-qt-dev-candidate
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DEV_VERSION: "1.3.12"
      DEV_BUILD_ID: "dev-${{ github.run_number }}"

    steps:
      - name: Checkout Qt rebuild
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies once
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r build/requirements-build.txt "PyYAML>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Fast Qt smoke before packaging
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python jarvis_qt_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Qt smoke failed" }

      - name: Build Qt Dev installer
        shell: pwsh
        run: |
          ./build/build_qt_dev.ps1 `
            -Version "$env:DEV_VERSION" `
            -BuildId "$env:DEV_BUILD_ID" `
            -Repository "${{ github.repository }}" `
            -RunNumber "${{ github.run_number }}"

      - name: Upload private CI candidate
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Qt-Dev-${{ env.DEV_BUILD_ID }}
          path: |
            release/JARVIS_Setup_${{ env.DEV_VERSION }}.exe
            release/JARVIS_Setup_${{ env.DEV_VERSION }}.exe.sha256
            release/dev-build.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish Dev prerelease asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "qt-dev-latest"
          $repo = "${{ github.repository }}"
          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $repo `
              --prerelease `
              --target "${{ github.sha }}" `
              --title "JARVIS Qt Dev - canal de testes" `
              --notes "Build experimental da reconstrução Qt. Não é Stable e não é oferecida a usuários do canal Stable."
            if ($LASTEXITCODE -ne 0) { throw "Could not create Dev prerelease" }
          }
          gh release upload $tag `
            "release/JARVIS_Setup_$env:DEV_VERSION.exe" `
            "release/JARVIS_Setup_$env:DEV_VERSION.exe.sha256" `
            --repo $repo `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload Dev installer" }

      - name: Update Dev manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $identity = Get-Content -LiteralPath "release/dev-build.json" -Raw | ConvertFrom-Json
          $assetName = "JARVIS_Setup_$env:DEV_VERSION.exe"
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/qt-dev-latest/$assetName"
          $manifest = [ordered]@{
            available = $true
            channel = "dev"
            version = [string]$identity.version
            build_id = [string]$identity.build_id
            installer_name = $assetName
            download_url = $assetUrl
            sha256 = [string]$identity.sha256
            size = [int64]$identity.size
            tag = "qt-dev-latest"
            html_url = "https://github.com/${{ github.repository }}/releases/tag/qt-dev-latest"
            notes = "Reconstrução Qt - build $env:DEV_BUILD_ID"
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath "updates/dev.json" -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/dev.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "dev: publish $env:DEV_BUILD_ID manifest"
            git push origin HEAD:ui/qt-reference-rebuild
          }
