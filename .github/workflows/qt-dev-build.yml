name: JARVIS Qt Private Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - ui/qt-reference-rebuild
    paths:
      - ".github/qt-dev-request.json"

permissions:
  contents: write

concurrency:
  group: jarvis-qt-private-candidate
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DEV_VERSION: "1.3.13"
      DEV_BUILD_ID: "dev-${{ github.run_number }}"

    steps:
      - name: Checkout Qt rebuild
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies once
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r build/requirements-build.txt "PyYAML>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Validate single-source Qt code
        shell: pwsh
        run: |
          python -m py_compile main.py gui.py first_run_setup.py jarvis_qt_bridge.py jarvis_qt_ui_smoke.py tools/prepare_release.py tools/restore_ui_assets.py
          if ($LASTEXITCODE -ne 0) { throw "Qt source syntax validation failed" }

          $legacy = @(
            "gui_qt_dev.py", "gui_qt_integrated.py", "gui_qt_reference.py", "gui_qt_reference_v2.py",
            "gui_reference_exact.py", "gui_reference_exact_v2.py", "gui_reference_exact_v3.py",
            "gui_reference_final_1311.py", "gui_reference_final_1312.py", "gui_reference_release_1312.py",
            "jarvis_reference_orb.py", "jarvis_reference_scene_139.py", "jarvis_visual_runtime.py"
          ) | Where-Object { Test-Path -LiteralPath $_ }
          if ($legacy.Count -gt 0) { throw "Legacy visual files remain: $($legacy -join ', ')" }

      - name: Restore approved UI assets from Git history
        shell: pwsh
        run: |
          python tools/restore_ui_assets.py
          if ($LASTEXITCODE -ne 0) { throw "Approved UI asset restoration failed" }

      - name: Strict approved Qt smoke before packaging
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          JARVIS_DISABLE_VOICE_BOOT: "1"
          JARVIS_DISABLE_UPDATE_BOOT: "1"
        run: |
          python jarvis_qt_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Single-source Qt smoke failed" }

      - name: Build single-source Qt Dev installer
        shell: pwsh
        run: |
          ./build/build_qt_dev.ps1 `
            -Version "$env:DEV_VERSION" `
            -BuildId "$env:DEV_BUILD_ID" `
            -Repository "${{ github.repository }}" `
            -RunNumber "${{ github.run_number }}"

      - name: Publish installer to private draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "qt-dev-private-$env:DEV_BUILD_ID"
          $title = "JARVIS Qt Private $env:DEV_BUILD_ID"
          $notes = @"
          Private Qt candidate for manual validation.

          Version: $env:DEV_VERSION
          Build: $env:DEV_BUILD_ID
          Commit: ${{ github.sha }}
          UI source: gui.py only
          Assets: workspace_bg.jpg, sphere_3d.webp (reconstructed from approved Git history)

          This release stays in DRAFT and is not published as prerelease/latest.
          The public Stable release and public update manifest are not changed.
          "@

          gh release create $tag `
            --repo $repo `
            --draft `
            --target "${{ github.sha }}" `
            --title $title `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Could not create private draft release" }

          gh release upload $tag `
            "release/JARVIS_Setup_$env:DEV_VERSION.exe" `
            "release/JARVIS_Setup_$env:DEV_VERSION.exe.sha256" `
            "release/dev-build.json" `
            --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "Could not upload private installer" }

          Write-Host "PRIVATE_DRAFT_TAG=$tag"
          Write-Host "DEV_BUILD_ID=$env:DEV_BUILD_ID"

      - name: Confirm private candidate identity
        shell: pwsh
        run: |
          $identity = Get-Content -LiteralPath "release/dev-build.json" -Raw | ConvertFrom-Json
          Write-Host "Version: $($identity.version)"
          Write-Host "Build: $($identity.build_id)"
          Write-Host "SHA256: $($identity.sha256)"
          Write-Host "Size: $($identity.size)"
          Write-Host "UI source: $($identity.ui_source)"
          if ([string]$identity.build_id -ne $env:DEV_BUILD_ID) { throw "Build identity mismatch" }
          if ([string]$identity.ui_source -ne "gui.py") { throw "UI source identity mismatch" }
