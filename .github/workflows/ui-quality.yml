name: JARVIS UI Quality

on:
  workflow_dispatch:
  push:
    branches: [main, ui/responsive-quality]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/ui-quality.yml"

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Preserve exact source for reproducible validation
        shell: pwsh
        run: |
          git archive --format=zip HEAD -o validation-source.zip
          if ($LASTEXITCODE -ne 0) { throw "Source archive failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ui-validation-source
          path: validation-source.zip
          retention-days: 3
          if-no-files-found: error
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
      - name: Validate source and release preparation
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Syntax validation failed" }
          python tools/restore_large_assets.py
          if ($LASTEXITCODE -ne 0) { throw "Asset validation failed" }
          python tools/prepare_release.py --version 1.3.5 --repository "${{ github.repository }}" --run-number "${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { throw "Entry point preparation failed" }
          foreach ($test in @("jarvis_hot_update_selftest.py", "jarvis_desktop_selftest.py", "jarvis_build16_selftest.py", "jarvis_v8_selftest.py")) {
            python $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
      - name: Exercise responsive UI when present
        shell: pwsh
        run: |
          if (Test-Path jarvis_ui_selftest.py) {
            python jarvis_ui_selftest.py
            if ($LASTEXITCODE -ne 0) { throw "UI behavior tests failed" }
          } else {
            Write-Host "Baseline only: responsive UI tests not added yet."
          }
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-validation-evidence
          path: validation/
          if-no-files-found: ignore
          retention-days: 7
