name: JARVIS UI Quality

on:
  workflow_dispatch:
  push:
    branches: [main, ui/responsive-quality, fix/voice-lifecycle-136]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/ui-quality.yml"
      - ".github/workflows/build-release.yml"

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production and validation dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r build/requirements-build.txt "PyYAML>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
      - name: Preserve source identity before metadata preparation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation | Out-Null
          git archive --format=zip HEAD -o validation/validated-source.zip -- gui_reference_exact_v3.py gui_conversation_shell.py jarvis_reference_scene_139.py jarvis_voice_overlay_139.py voice_overlay_qt.py jarvis_antonio_tts.py hot_update_runtime.py jarvis_139_selftest.py jarvis_voice_lifecycle_136.py jarvis_voice_lifecycle_selftest.py jarvis_ui_render.py jarvis_display.py jarvis_quick_controls.py jarvis_ui_selftest.py tools/ui_preflight.py tools/renderer_smoke.py tools/display_smoke.py .github/workflows
          if ($LASTEXITCODE -ne 0) { throw "Source archive failed" }
      - name: Preflight and legacy regression gates
        shell: pwsh
        run: |
          python tools/restore_large_assets.py
          if ($LASTEXITCODE -ne 0) { throw "Asset integrity failed" }
          python tools/prepare_release.py --version 1.3.9 --repository "${{ github.repository }}" --run-number "${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { throw "Release preparation failed" }
          python tools/ui_preflight.py --version 1.3.9
          if ($LASTEXITCODE -ne 0) { throw "Preflight failed" }
          foreach ($test in @("jarvis_hot_update_selftest.py", "jarvis_desktop_selftest.py", "jarvis_build16_selftest.py", "jarvis_v8_selftest.py", "jarvis_voice_lifecycle_selftest.py", "jarvis_139_selftest.py")) {
            python $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
      - name: Exercise real responsive UI
        shell: pwsh
        run: |
          python jarvis_ui_selftest.py
          if ($LASTEXITCODE -ne 0) { throw "UI behavior tests failed" }
      - name: Verify native monitor fitting
        shell: pwsh
        run: |
          python tools/display_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Native display fitting failed" }
      - name: Freeze and exercise production renderer
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name JARVIS-Renderer-Smoke --paths . --distpath validation/frozen --workpath validation/frozen-work --specpath validation tools/renderer_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Renderer freeze failed" }
          & "validation/frozen/JARVIS-Renderer-Smoke/JARVIS-Renderer-Smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Frozen renderer failed" }
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-validation-evidence
          path: |
            validation/*.json
            validation/*.png
            validation/validated-source.zip
          if-no-files-found: error
          retention-days: 14
