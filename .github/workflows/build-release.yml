name: Build JARVIS Desktop Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão candidata do JARVIS"
        required: true
        default: "1.3.12"
  push:
    branches:
      - main
    paths:
      - ".github/build-request.json"

permissions:
  contents: write

concurrency:
  group: jarvis-full-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Resolver versão da candidata
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq "push") {
            $request = Get-Content -LiteralPath ".github/build-request.json" -Raw | ConvertFrom-Json
            $version = [string]$request.version
          } else {
            $version = [string]$env:INPUT_VERSION
          }
          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versão inválida: '$version'"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Preparar Python para compilacao
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Preflight completo antes de compilar
        shell: powershell
        run: |
          python -m pip install -r requirements.txt "PyYAML>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Dependencias de preflight indisponiveis" }
          python tools/restore_large_assets.py
          if ($LASTEXITCODE -ne 0) { throw "Assets invalidos" }
          python tools/prepare_release.py --version "$env:RELEASE_VERSION" --repository "${{ github.repository }}" --run-number "${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { throw "Preparacao canonica falhou" }
          python tools/ui_preflight.py --version "$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Preflight falhou" }
          foreach ($test in @("jarvis_hot_update_selftest.py", "jarvis_desktop_selftest.py", "jarvis_build16_selftest.py", "jarvis_v8_selftest.py", "jarvis_voice_lifecycle_selftest.py", "jarvis_139_selftest.py", "jarvis_reference_final_selftest.py", "jarvis_ui_selftest.py", "jarvis_reference_ui_smoke.py")) {
            python $test
            if ($LASTEXITCODE -ne 0) { throw "$test falhou" }
          }

      - name: Validar ajuste real ao monitor
        shell: powershell
        run: |
          python tools/display_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Ajuste automatico ao monitor falhou" }

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Compilar JARVIS Desktop
        shell: powershell
        run: |
          ./build/build_windows.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -Repository "${{ github.repository }}" `
            -RunNumber "${{ github.run_number }}"

      - name: Salvar instalador para teste
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Desktop-${{ env.RELEASE_VERSION }}-candidate
          path: |
            release/JARVIS_Setup_${{ env.RELEASE_VERSION }}.exe
            release/JARVIS_Setup_${{ env.RELEASE_VERSION }}.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Criar release privada em rascunho
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$env:RELEASE_VERSION"
          $repo = "${{ github.repository }}"
          $existing = $null

          try {
            $raw = gh release view $tag --repo $repo --json tagName,isDraft 2>$null
            if ($LASTEXITCODE -eq 0 -and $raw) {
              $existing = $raw | ConvertFrom-Json
            }
          } catch {
            $existing = $null
          }

          if ($existing -and -not [bool]$existing.isDraft) {
            throw "A release $tag já está pública. Releases estáveis são imutáveis; use uma nova versão para outra candidata."
          }

          if (-not $existing) {
            gh release create $tag `
              --repo $repo `
              --draft `
              --target "${{ github.sha }}" `
              --title "JARVIS Desktop $env:RELEASE_VERSION - candidata" `
              --notes-file "RELEASE_NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a release privada $tag" }
          }

          gh release upload $tag `
            "release/JARVIS_Setup_$env:RELEASE_VERSION.exe" `
            "release/JARVIS_Setup_$env:RELEASE_VERSION.exe.sha256" `
            --repo $repo `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar assets privados para $tag" }

          Write-Host "Candidata $tag pronta em rascunho. Ela NÃO foi publicada e NÃO foi marcada como latest."

      - name: Salvar evidencias de validacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-validation-${{ env.RELEASE_VERSION }}-${{ github.run_number }}
          path: |
            validation/*.json
            validation/*.png
            build/pyinstaller/runtime-selftest*.json
            build/pyinstaller/hot-runtime-smoke/runtime-selftest-hot.json
          if-no-files-found: ignore
          retention-days: 14
