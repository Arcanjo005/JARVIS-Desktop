name: Build and Publish JARVIS Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do JARVIS"
        required: true
        default: "1.2.7"
  push:
    branches:
      - main
    paths:
      - ".github/build-request.json"

permissions:
  contents: write

concurrency:
  group: jarvis-full-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Resolver versão da release
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq "push") {
            $request = Get-Content -LiteralPath ".github/build-request.json" -Raw | ConvertFrom-Json
            $version = [string]$request.version
          } else {
            $version = [string]$env:INPUT_VERSION
          }
          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versão inválida: '$version'"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ativar interface exata da referência
        shell: powershell
        run: |
          $mainPath = "main.py"
          $main = Get-Content -LiteralPath $mainPath -Raw
          $old = "from gui import JarvisGUI"
          $legacy = "from gui_conversation_shell import JarvisGUI"
          $exact = "from gui_reference_exact import JarvisGUI"

          if ($main.Contains($old)) {
            $main = $main.Replace($old, $exact)
          } elseif ($main.Contains($legacy)) {
            $main = $main.Replace($legacy, $exact)
          } elseif (-not $main.Contains($exact)) {
            throw "Entry point do JARVIS não contém um import de GUI reconhecido."
          }

          # Remove qualquer hook do renderer PBR antigo. A referência aprovada
          # agora é a fonte visual, inclusive para a esfera central.
          $main = $main -replace '(?m)^\s*from jarvis_visual_runtime import install as _install_visual_runtime\s*\r?\n?', ''
          $main = $main -replace '(?m)^\s*_install_visual_runtime\(JarvisGUI\)\s*\r?\n?', ''
          Set-Content -LiteralPath $mainPath -Value $main -Encoding utf8

          $verified = Get-Content -LiteralPath $mainPath -Raw
          if (-not $verified.Contains($exact)) {
            throw "Falha ao ativar gui_reference_exact no entry point."
          }
          if ($verified.Contains("_install_visual_runtime(JarvisGUI)")) {
            throw "Renderer PBR antigo ainda está ativo."
          }
          foreach ($required in @("gui_reference_exact.py", "gui_conversation_shell.py", "jarvis_reference_orb.py")) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "$required ausente."
            }
          }
          Write-Host "[JARVIS] Entry point confirmado: gui_reference_exact.JarvisGUI"

      - name: Preparar Python para compilacao
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validar sintaxe da interface de referência
        shell: powershell
        run: |
          python -m py_compile main.py gui_reference_exact.py gui_conversation_shell.py jarvis_reference_orb.py
          if ($LASTEXITCODE -ne 0) { throw "Preflight da interface exata falhou com codigo $LASTEXITCODE" }
          Write-Host "[JARVIS] Preflight da interface de referência: PASS"

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Compilar JARVIS Desktop
        shell: powershell
        run: |
          ./build/build_windows.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -Repository "${{ github.repository }}" `
            -RunNumber "${{ github.run_number }}"

      # Compatibilidade com o guard legado em jarvis_desktop_selftest.py:
      # JARVIS_Setup_${{ inputs.version }}.exe
      - name: Salvar instalador
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Desktop-${{ env.RELEASE_VERSION }}
          path: |
            release/JARVIS_Setup_${{ env.RELEASE_VERSION }}.exe
            release/JARVIS_Setup_${{ env.RELEASE_VERSION }}.exe.sha256
          if-no-files-found: error

      - name: Criar Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$env:RELEASE_VERSION"
          $repo = "${{ github.repository }}"
          $releaseExists = $false

          try {
            gh release view $tag --repo $repo --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $releaseExists = $true
            }
          } catch {
            $releaseExists = $false
          }

          if (-not $releaseExists) {
            gh release create $tag `
              --repo $repo `
              --draft `
              --target "${{ github.sha }}" `
              --title "JARVIS Desktop $env:RELEASE_VERSION" `
              --notes-file "RELEASE_NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a release $tag" }
          }

          gh release upload $tag `
            "release/JARVIS_Setup_$env:RELEASE_VERSION.exe" `
            "release/JARVIS_Setup_$env:RELEASE_VERSION.exe.sha256" `
            --repo $repo `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar assets para $tag" }

          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a release $tag" }
