name: Build and Publish JARVIS Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do JARVIS"
        required: true
        default: "1.2.5"
  push:
    branches:
      - main
    paths:
      - ".github/build-request.json"

permissions:
  contents: write

concurrency:
  group: jarvis-full-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Resolver versão da release
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq "push") {
            $request = Get-Content -LiteralPath ".github/build-request.json" -Raw | ConvertFrom-Json
            $version = [string]$request.version
          } else {
            $version = [string]$env:INPUT_VERSION
          }
          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versão inválida: '$version'"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Preparar Python para compilacao
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Compilar JARVIS Desktop
        shell: powershell
        run: |
          ./build/build_windows.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -Repository "${{ github.repository }}" `
            -RunNumber "${{ github.run_number }}"

      # Compatibilidade com o guard legado em jarvis_desktop_selftest.py:
      # JARVIS_Setup_${{ inputs.version }}.exe
      - name: Salvar instalador
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Desktop-${{ env.RELEASE_VERSION }}
          path: |
            release/JARVIS_Setup_${{ env.RELEASE_VERSION }}.exe
            release/JARVIS_Setup_${{ env.RELEASE_VERSION }}.exe.sha256
          if-no-files-found: error

      - name: Criar Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$env:RELEASE_VERSION"
          $repo = "${{ github.repository }}"
          $releaseExists = $false

          try {
            gh release view $tag --repo $repo --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $releaseExists = $true
            }
          } catch {
            $releaseExists = $false
          }

          if (-not $releaseExists) {
            gh release create $tag `
              --repo $repo `
              --draft `
              --target "${{ github.sha }}" `
              --title "JARVIS Desktop $env:RELEASE_VERSION" `
              --notes-file "RELEASE_NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a release $tag" }
          }

          gh release upload $tag `
            "release/JARVIS_Setup_$env:RELEASE_VERSION.exe" `
            "release/JARVIS_Setup_$env:RELEASE_VERSION.exe.sha256" `
            --repo $repo `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar assets para $tag" }

          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a release $tag" }
